[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cn-pdf-trace"
version = "0.2.1"
description = "Local Chinese PDF excerpt provenance and consistency demo"
readme = "README.md"
# Own content is MIT; embedded PDF fonts retain OFL. See third_party/NOTICE.md.
# Omit a shared License-Expression because sdist and wheel contain different material.
license-files = ["LICENSE", "third_party/*.txt", "third_party/NOTICE.md"]
authors = [{name = "Mgb"}]
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling-slim[convert-core,format-pdf,models-local]==2.141.0",
  "pypdfium2>=4.30,<6",
  "pypdf>=6,<7",
  "opencv-python-headless>=4.13,<5",
  "markdown-it-py>=4,<5",
  "torch==2.14.1",
  "torchvision==0.29.1",
]

[project.optional-dependencies]
dev = ["reportlab>=4.4,<5", "fonttools>=4.60,<5", "pytest>=9,<10", "ruff>=0.15,<0.16"]
ocr-mac = ["docling-slim[feat-ocr-mac]==2.141.0 ; sys_platform == 'darwin'"]

[project.scripts]
cntrace = "cntrace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["integration: runs Docling with local model weights"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/cntrace"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/third_party", "/fixtures", "/examples",
  "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/.gitignore",
  "/pyproject.toml", "/uv.lock", "/models.lock.json", "/font.lock.json",
]
exclude = ["**/__pycache__", "**/*.pyc", "/scripts/prepare_release.py",
  "/docs/phase*-results.md", "/docs/upstream-audit.md"]

# The CPU index is scoped to these packages on Linux; all other packages use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
